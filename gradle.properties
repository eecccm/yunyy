# ===== 模组基础信息（NeoForge/Forge 规范：gradle.properties 内联到元数据）=====
mod_id=yunyy
mod_name=云音乐
mod_version=1.0.0
mod_license=GPL-3.0 with linking exception
mod_group_id=com.eecccm.yunyy
mod_authors=eecccm
mod_description=直接在我的世界里面听歌。支持网易云、酷狗、QQ 音乐三平台点歌、歌单与账号 VIP 状态，可以让服务器内的玩家同步聆听或自己聆听。本模组由 eecccm 与 AI 协作完成，部分内容由 AI 辅助生成。

# ===== Minecraft / 加载器版本 =====
minecraft_version=26.2
# Fabric（依赖 fabric-api 0.161.0+26.2）
fabric_loader_version=0.19.5
fabric_api_version=0.161.0+26.2
fabric_loom_version=1.11-SNAPSHOT
# NeoForge / Forge（坐标按运行时构件实测对齐，二者为相互独立的构件）
#   - NeoForge = net.neoforged:neoforge:<MC>.<minor>.<patch>，如 26.2.0.90，
#               由 ModDevGradle（neoforge 模块）构建；neoForge.version 只认该坐标。
#   - Forge    = net.minecraftforge:forge:<MC>-<build>，如 26.2-65.1.5，
#               必须由 ForgeGradle（forge 模块）构建。MDG 只能解析 net.neoforged:neoforge，
#               解析不了 net.minecraftforge:forge —— 这正是 forge 模块此前误用 MDG 在 CI 失败的根因
#               （Actions run #1：Could not find net.neoforged:neoforge:26.2-65.1.5）。
# 两个版本号各自独立、互不相等，切勿混用。
neoforge_version=26.2.0.90
neo_version_range=[26.2,)
forge_version=26.2-65.1.5
moddevgradle_version=2.0.148

# ===== 构建 =====
# 本模组目标 MC 26.2 要求 Java 25，因此必须使用 Gradle 9.x（8.x 内置 ASM 不认 Java 25 字节码），
# 且 Gradle 守护进程运行在 JDK 25 上（Loom/ModDevGradle/ForgeGradle 校验的是守护进程 JVM 版本）。
# 模组源码由 java toolchain 指定的 JDK 25 编译（release=25）。
# 构建方式：使用仓库内置 Gradle Wrapper（gradle-9.7.0），克隆后 ./gradlew 即可在 JDK 25 上构建。
# CI（GitHub Actions，ubuntu-latest）同理在 JDK 25 下构建，由 actions/setup-java 注入 JAVA_HOME，
# 故不在此硬编码本机 Windows JDK 路径（跨平台兼容）。
org.gradle.jvmargs=-Xmx3G
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=false
