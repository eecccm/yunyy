pluginManagement {
    // 仓库顺序：先把可靠、通用的仓库放前面，避免标准构件（commons-io/gson/guava 等）
    // 被转发到可能不稳定的加载器官方仓库而整体超时。Forge/NeoForge/Fabric 专用仓库置后，
    // 仅用于解析各自专属工件（如 net.minecraftforge:forge、net.neoforged:neoforge）。
    repositories {
        gradlePluginPortal()
        mavenCentral()
        maven { name = 'Fabric'; url = 'https://maven.fabricmc.net/' }
        maven { name = 'Forge'; url = 'https://maven.minecraftforge.net/' }
        maven { name = 'NeoForged'; url = 'https://maven.neoforged.net/releases/' }
    }
}

rootProject.name = 'yunyy'
include 'common'
include 'mccore'
include 'fabric'
include 'forge'
include 'neoforge'
