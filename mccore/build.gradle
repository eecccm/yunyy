// mccore：MC 耦合共享层，不依赖任何加载器 API。
// 关键约束：目标 MC 26.2 官方未发布混淆映射、Yarn 也无 26.x 构建，Loom 无法为 26.2 搭建。
// 因此 mccore 不再自行引入 Loom/Yarn，而是作为“被加载器模块以 sourceSet 方式包含”的纯源码层：
//   - Forge/NeoForge 模块用 ModDevGradle 的 mods{ sourceSet project(':mccore').sourceSets.main }
//     在编译本模组时一并为 mccore 提供对应加载器反混淆后的 Minecraft 类；
//   - mccore 自身不独立编译（无 MC 依赖），也不产生可被单独打包的 jar，避免触发 Loom/Yarn 解析。
// mccore 中对 Minecraft 的引用均使用与官方映射一致的命名（net.minecraft.client.Minecraft 等），
// 因此可被 Forge/NeoForge 的 official-mapped Minecraft 直接编译。
plugins {
    id 'java-library'
}

version = rootProject.property('mod_version')
group = rootProject.property('mod_group_id')

dependencies {
    // 仅依赖纯 JDK 底层库 common（Gson 等），不在此引入 Minecraft，MC 由消费方加载器提供
    implementation project(':common')
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 25
}

// mccore 不单独产出可分发 jar：其编译产物由 Forge/NeoForge 加载器模块在合并源码层时一并打包。
jar {
    enabled = false
}
