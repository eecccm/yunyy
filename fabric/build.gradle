plugins {
    id 'fabric-loom' version "${fabric_loom_version}"
}

version = rootProject.property('mod_version')
group = rootProject.property('mod_group_id')

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    // 映射：MC 26.2 官方未发布混淆映射，Yarn 也无 26.x 构建（net.fabricmc:yarn:26.2+build.1 不存在）。
    // 因此 Fabric 加载器在本环境无法经 Loom 搭建；映射源就绪（可访问的 Yarn/官方映射）后此行方可生效。
    mappings "net.fabricmc:yarn:${minecraft_version}+build.1:v2"
    modImplementation "net.fabricmc:fabric-loader:${fabric_loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${fabric_api_version}"
    // common 是正常产出 jar 的纯 JDK 层（Gson 等），可安全作为 implementation 依赖；
    // mccore 不再以 implementation 引入（其 jar 已禁用），改由下方 loom{ mods{ sourceSet } }
    // 以源集方式参与本模组的编译与打包，由 Loom 提供反混淆后的 Minecraft 类。
    implementation project(':common')
}

loom {
    // 资源命名空间统一为 mod_id
    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
            sourceSet project(':common').sourceSets.main
            sourceSet project(':mccore').sourceSets.main
        }
    }
}

processResources {
    filesMatching('fabric.mod.json') {
        expand 'mod_id': mod_id, 'mod_name': mod_name, 'mod_version': mod_version,
               'mod_authors': mod_authors, 'mod_description': mod_description,
               'minecraft_version': minecraft_version, 'fabric_loader_version': fabric_loader_version
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 25
}

// 最终 jar 的打包由 Loom 的 loom{ mods{ sourceSet ... } } 自动完成：
// 凡是声明在 mods 内的源集（main / :common / :mccore）都会被一并编译并打进 jar，
// 因此此处无需再用 from 手动合并，避免与 Loom 自动打包产生重复条目。
// 仅自定义产出文件名。
jar {
    archiveFileName = "${mod_id}-${mod_version}+mc${minecraft_version}-fabric.jar"
}
