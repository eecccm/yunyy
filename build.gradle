// 根工程：仅聚合子模块，不放任何插件逻辑。
// 各加载器插件按模块分别应用（fabric→Loom，forge/neoforge→ModDevGradle）。
subprojects {
    apply plugin: 'java'
    group = rootProject.property('mod_group_id')
    version = rootProject.property('mod_version')

    // 依赖仓库：common 为纯 JDK 模块，不挂任何加载器插件，
    // 必须自建 Maven Central 才能解析 Gson 等标准库；
    // 加载器模块（Loom / ModDevGradle）会在自身插件基础上追加各自的仓库，互不冲突。
    repositories {
        mavenCentral()
    }

    java {
        toolchain {
            languageVersion = JavaLanguageVersion.of(25)
        }
    }

    tasks.withType(JavaCompile).configureEach {
        options.encoding = 'UTF-8'
    }
}
