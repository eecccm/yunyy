plugins {
    id 'net.neoforged.moddev' version "${moddevgradle_version}"
}

version = rootProject.property('mod_version')
group = rootProject.property('mod_group_id')

dependencies {
    // common 是正常产出 jar 的纯 JDK 层（Gson 等），可安全作为 implementation 依赖；
    // mccore 不再以 implementation 引入（其 jar 已禁用），改由下方 neoForge{ mods{ sourceSet } }
    // 以源集方式参与本模组的编译与打包，由加载器提供反混淆后的 Minecraft 类。
    implementation project(':common')
}

neoForge {
    version = "${neoforge_version}"
    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
            sourceSet project(':common').sourceSets.main
            sourceSet project(':mccore').sourceSets.main
        }
    }
    runs {
        client {
            client()
            systemProperty 'neoforge.enabledGameTestNamespaces', mod_id
        }
        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', mod_id
        }
    }
}

processResources {
    filesMatching('META-INF/neoforge.mods.toml') {
        expand 'mod_id': mod_id, 'mod_name': mod_name, 'mod_version': mod_version,
               'mod_authors': mod_authors, 'mod_description': mod_description,
               'minecraft_version': minecraft_version, 'neo_version_range': neo_version_range
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 25
}

// 最终 jar 的打包由 ModDevGradle 的 neoForge{ mods{ sourceSet ... } } 自动完成：
// 凡是声明在 mods 内的源集（main / :common / :mccore）都会被一并编译并打进 jar，
// 因此此处无需再用 from 手动合并，避免与 MDG 自动打包产生重复条目。
// 仅自定义产出文件名。
jar {
    archiveFileName = "${mod_id}-${mod_version}+mc${minecraft_version}-neoforge.jar"
}
